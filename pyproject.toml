[project]
name = "rescuehandsai"
version = "0.1.0"
description = "Two simulated SO-101 arms set a dinner place with SmolVLA, a physics-aware supervisor and OpenVINO inference"
readme = "README.md"
authors = [
    { name = "Hamza Atiq", email = "hamzaatiq34@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imageio>=2.37.4",
    "matplotlib>=3.11.2",
    "mujoco>=3.13.0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "scipy>=1.18.1",
]

[project.scripts]
rescuehandsai = "rescuehandsai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
